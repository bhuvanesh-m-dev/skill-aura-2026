<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Saranya Krishnan | AI & Technology Portfolio</title><meta name="description"content="Portfolio of Saranya Krishnan, Computer Science and Engineering student at Kings Engineering College, Chennai."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>/* =========================================================   ROOT========================================================= */:root {    --rose: #E17888;    --magenta: #AE3B8B;    --blue: #1C5789;    --wine: #341514;    --black: #080608;    --black-2: #0d080c;    --card: rgba(52, 21, 20, 0.28);    --text: #f8edf1;    --muted: #bdaeb5;    --gradient:        linear-gradient(            120deg,            #E17888,            #AE3B8B,            #1C5789        );    --transition: 0.35s cubic-bezier(.2,.8,.2,1);}/* =========================================================   RESET========================================================= */* {    margin: 0;    padding: 0;    box-sizing: border-box;}html {    scroll-behavior: smooth;}body {    background:        radial-gradient(circle at 15% 15%, rgba(174,59,139,.12), transparent 30%),        radial-gradient(circle at 85% 30%, rgba(28,87,137,.12), transparent 30%),        var(--black);    color: var(--text);    font-family: "DM Sans", sans-serif;    overflow-x: hidden;}a {    text-decoration: none;    color: inherit;}button {    font-family: inherit;}/* =========================================================   CURSOR GLOW========================================================= */.cursor-glow {    position: fixed;    width: 260px;    height: 260px;    border-radius: 50%;    pointer-events: none;    background: radial-gradient(        circle,        rgba(225,120,136,.12),        rgba(174,59,139,.05),        transparent 70%    );    transform: translate(-50%, -50%);    z-index: 0;}/* =========================================================   PARTICLES========================================================= */#particles {    position: fixed;    inset: 0;    z-index: -1;    pointer-events: none;}/* =========================================================   LOADER========================================================= */.loader {    position: fixed;    inset: 0;    background: #080608;    display: flex;    align-items: center;    justify-content: center;    z-index: 9999;    transition: opacity .8s ease, visibility .8s ease;}.loader.hide {    opacity: 0;    visibility: hidden;}.loader-content {    text-align: center;}.loader-symbol {    font-size: 55px;    margin-bottom: 20px;    animation: pulse 1.5s infinite;}.loader-text {    font-family: "Space Mono", monospace;    color: var(--rose);    letter-spacing: 4px;}.loader-line {    width: 180px;    height: 2px;    margin: 18px auto;    background: var(--wine);    overflow: hidden;}.loader-line span {    display: block;    width: 50%;    height: 100%;    background: var(--gradient);    animation: loading 1.2s infinite;}@keyframes loading {    from { transform: translateX(-120%); }    to { transform: translateX(250%); }}/* =========================================================   NAVBAR========================================================= */.navbar {    position: fixed;    top: 0;    left: 0;    width: 100%;    height: 76px;    display: flex;    align-items: center;    justify-content: space-between;    padding: 0 7%;    background: rgba(8,6,8,.72);    backdrop-filter: blur(18px);    border-bottom: 1px solid rgba(225,120,136,.12);    z-index: 1000;}.logo {    font-family: "Playfair Display", serif;    font-size: 27px;    font-style: italic;    background: var(--gradient);    -webkit-background-clip: text;    color: transparent;}.logo span {    font-family: "Space Mono", monospace;    font-size: 9px;    display: block;    letter-spacing: 3px;    font-style: normal;    color: var(--rose);    -webkit-text-fill-color: var(--rose);}.nav-links {    display: flex;    gap: 30px;    list-style: none;}.nav-links a {    position: relative;    color: #d7cbd0;    font-size: 13px;    transition: var(--transition);}.nav-links a:hover,.nav-links a.active {    color: var(--rose);}.nav-links a::after {    content: "";    position: absolute;    left: 0;    bottom: -8px;    width: 0;    height: 2px;    background: var(--gradient);    transition: var(--transition);}.nav-links a:hover::after,.nav-links a.active::after {    width: 100%;}.menu-btn {    display: none;    border: 0;    background: none;    color: white;    font-size: 25px;    cursor: pointer;}/* =========================================================   GENERAL========================================================= */section {    position: relative;    padding: 110px 8%;}.section-label {    color: var(--rose);    font-family: "Space Mono", monospace;    font-size: 11px;    letter-spacing: 4px;    text-transform: uppercase;    margin-bottom: 12px;}.section-title {    font-family: "Playfair Display", serif;    font-size: clamp(38px, 5vw, 65px);    line-height: 1;    margin-bottom: 45px;}.section-title span {    background: var(--gradient);    -webkit-background-clip: text;    color: transparent;}.container {    max-width: 1250px;    margin: auto;}/* =========================================================   HERO========================================================= */.hero {    min-height: 100vh;    display: flex;    align-items: center;    padding-top: 130px;    overflow: hidden;}.hero-grid {    max-width: 1250px;    margin: auto;    width: 100%;    display: grid;    grid-template-columns: 1fr 1fr;    align-items: center;    gap: 50px;}.hero-small {    color: var(--rose);    font-family: "Space Mono", monospace;    letter-spacing: 4px;    font-size: 12px;    margin-bottom: 20px;}.hero h1 {    font-family: "Playfair Display", serif;    font-size: clamp(65px, 9vw, 125px);    line-height: .8;    font-weight: 600;}.hero h1 span {    display: block;    background: var(--gradient);    -webkit-background-clip: text;    color: transparent;}.hero-script {    font-size: clamp(40px, 5vw, 68px);    font-style: italic;    font-weight: 500;    margin-left: 35px;    color: #fff;}.hero-description {    max-width: 580px;    color: var(--muted);    line-height: 1.9;    margin: 35px 0;    font-size: 15px;}.hero-description strong {    color: var(--rose);}.hero-buttons {    display: flex;    gap: 15px;    flex-wrap: wrap;}.btn {    padding: 14px 24px;    border-radius: 5px;    border: 1px solid rgba(225,120,136,.6);    display: inline-flex;    align-items: center;    gap: 10px;    font-size: 13px;    transition: var(--transition);}.btn-primary {    background: var(--gradient);    color: white;    border: none;}.btn-outline {    background: transparent;}.btn:hover {    transform: translateY(-4px);    box-shadow: 0 15px 35px rgba(174,59,139,.25);}.hero-image {    position: relative;    height: 620px;    display: flex;    align-items: flex-end;    justify-content: center;}.hero-ring {    position: absolute;    width: 500px;    height: 500px;    border-radius: 50%;    border: 1px solid rgba(225,120,136,.35);    box-shadow:        0 0 35px rgba(174,59,139,.18),        inset 0 0 40px rgba(28,87,137,.1);    animation: rotateRing 15s linear infinite;}.hero-ring::before,.hero-ring::after {    content: "";
